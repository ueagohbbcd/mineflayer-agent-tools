name: Synthetic world-memory tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is what craft-arena runs; 22 is the oldest supported (engines).
        node: ['24', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r renderers/requirements.txt
      - run: npm test
      - run: npm run test:visual
